<!doctype html>
<html>
  <head>
    <title>Chatbot</title>
  </head>
  <body>
    <div class="js-container"></div>

    <script src="https://unpkg.com/supersimpledev/react.js"></script>
    <script src="https://unpkg.com/supersimpledev/react-dom.js"></script>

    <script src="https://unpkg.com/supersimpledev/chatbot.js"></script>

    <script src="https://unpkg.com/supersimpledev/babel.js"></script>
    <script type="text/babel">
      function ChatInput({ setChatMessages, chatMessages }) {
        const [inputText, setInputText] = React.useState("");
        const [isLoading, setIsLoading] = React.useState(false);

        async function sendMessage() {
          //   const newChatMessages = [
          //     ...chatMessages,
          //     { message: inputText, sender: "user", id: crypto.randomUUID() },
          //   ];
          if (isLoading) return;

          setInputText("");
          setIsLoading(true);

          const userMessage = {
            message: inputText,
            sender: "user",
            id: crypto.randomUUID(),
          };

          const loadingMessage = {
            message: "Loading...",
            sender: "robot",
            id: crypto.randomUUID(),
          };

          setChatMessages([...chatMessages, userMessage, loadingMessage]);

          const response = await Chatbot.getResponseAsync(inputText);

          setChatMessages([
            // ...newChatMessages,
            ...chatMessages,
            userMessage,
            { message: response, sender: "robot", id: crypto.randomUUID() },
          ]);

          setInputText("");
          setIsLoading(false);
        }

        function saveInputText(event) {
          setInputText(event.target.value);
        }

        return (
          <>
            <input
              placeholder="Send a message to Chatbot"
              size="30"
              onChange={saveInputText}
              value={inputText}
              onKeyDown={(e) => {
                if (e.key === "Enter") {
                  sendMessage();
                } else if (e.key === "Escape") {
                  setInputText("");
                }
              }}
            />
            <button onClick={sendMessage}>
              {isLoading ? "sending..." : "Send"}
            </button>
          </>
        );
      }

      function ChatMessage({ message, sender }) {
        const senderImg = sender === "robot" ? "robot.png" : "user.png";

        return (
          <div>
            {sender === "user" && message}
            <img src={`images/${senderImg}`} width="50" />
            {sender === "robot" && message}
          </div>
        );
      }

      function ChatMessages({ chatMessages }) {
        return (
          <>
            {chatMessages.map((chatMessage, i) => {
              const { message, sender } = chatMessage;
              return <ChatMessage key={i} message={message} sender={sender} />;
            })}
          </>
        );
      }

      function App() {
        const [chatMessages, setChatMessages] = React.useState([
          { message: "Hello chatot", sender: "user" },
          { message: "Hello! How can I help you?", sender: "robot" },
          { message: "today's date", sender: "user" },
          { message: "Today is June 13", sender: "robot" },
        ]);

        return (
          <>
            <ChatInput
              chatMessages={chatMessages}
              setChatMessages={setChatMessages}
            />
            <ChatMessages chatMessages={chatMessages} />
          </>
        );
      }

      const container = document.querySelector(".js-container");
      ReactDOM.createRoot(container).render(<App />);
    </script>
  </body>
</html>
