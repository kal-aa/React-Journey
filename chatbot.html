<!doctype html>
<html>
  <head>
    <title>Chatbot</title>
    <style>
      body {
        font-family: Arial;
        margin-top: 0px;
        margin-bottom: 0px;
      }

      .send-button {
        background: green;
        color: white;
        padding: 12px 20px;
        margin-left: 10px;
        border: none;
        border-radius: 10px;
        font-size: 15px;
        cursor: pointer;
        background-color: rgb(25, 135, 84);
      }

      .chat-input {
        padding: 12px 15px;
        border-radius: 10px;
        border-width: 1px;
        font-size: 15px;
        flex-grow: 1;
      }

      .chat-input-container {
        display: flex;
        margin-bottom: 60px;
      }

      .app-container {
        max-width: 600px;
        margin-left: auto;
        margin-right: auto;
        height: 100vh;

        display: flex;
        flex-direction: column;
      }

      .chat-message-user {
        display: flex;
        justify-content: end;
        align-items: start;
      }

      .chat-message-robot {
        display: flex;
        align-items: start;
      }

      .chat-message-text {
        background-color: rgb(238, 238, 238);
        padding: 15px 20px;
        margin-right: 10px;
        margin-left: 10px;
        margin-bottom: 20px;
        max-width: 300px;
      }

      .chat-message-profile {
        width: 45px;
      }

      .chat-messages-container {
        flex-grow: 1;
        margin-top: 20px;
        overflow: scroll;
        scrollbar-width: none;
      }
    </style>
  </head>
  <body>
    <div id="js-container"></div>

    <script src="https://unpkg.com/supersimpledev/react.js"></script>
    <script src="https://unpkg.com/supersimpledev/react-dom.js"></script>

    <script src="https://unpkg.com/supersimpledev/chatbot.js"></script>

    <script src="https://unpkg.com/supersimpledev/babel.js"></script>
    <script type="text/babel">
      function ChatInput({ setChatMessages, chatMessages }) {
        const [inputText, setInputText] = React.useState("");
        const [isLoading, setIsLoading] = React.useState(false);

        async function sendMessage() {
          //   const newChatMessages = [
          //     ...chatMessages,
          //     { message: inputText, sender: "user", id: crypto.randomUUID() },
          //   ];
          if (isLoading) return;

          setInputText("");
          setIsLoading(true);

          const userMessage = {
            message: inputText,
            sender: "user",
            id: crypto.randomUUID(),
          };

          const loadingMessage = {
            message: "Loading...",
            sender: "robot",
            id: crypto.randomUUID(),
          };

          setChatMessages([...chatMessages, userMessage, loadingMessage]);

          const response = await Chatbot.getResponseAsync(inputText);

          setChatMessages([
            // ...newChatMessages,
            ...chatMessages,
            userMessage,
            { message: response, sender: "robot", id: crypto.randomUUID() },
          ]);

          setInputText("");
          setIsLoading(false);
        }

        function saveInputText(event) {
          setInputText(event.target.value);
        }

        return (
          <div className="chat-input-container">
            <input
              className="chat-input"
              placeholder="Send a message to Chatbot"
              size="30"
              onChange={saveInputText}
              value={inputText}
              onKeyDown={(e) => {
                if (e.key === "Enter") {
                  sendMessage();
                } else if (e.key === "Escape") {
                  setInputText("");
                }
              }}
            />
            <button className="send-button" onClick={sendMessage}>
              {isLoading ? "sending..." : "Send"}
            </button>
          </div>
        );
      }

      function ChatMessage({ message, sender }) {
        return (
          <div
            className={
              sender === "user" ? "chat-message-user" : "chat-message-robot"
            }
          >
            {sender === "user" && (
              <img src={`./Images/user.png`} className="chat-message-profile" />
            )}
            <div className="chat-message-text">{message}</div>
            {sender === "robot" && (
              <img
                src={`./Images/robot.png`}
                className="chat-message-profile"
              />
            )}
          </div>
        );
      }

      function ChatMessages({ chatMessages }) {
        const chatMessagesRef = React.useRef(null);
        React.useEffect(() => {
          const containerElem = chatMessagesRef.current;
          if (containerElem) {
            containerElem.scrollTop = containerElem.scrollHeight;
          }
        }, [chatMessages]);

        return (
          <div className="chat-messages-container" ref={chatMessagesRef}>
            {chatMessages.map((chatMessage, i) => {
              const { message, sender } = chatMessage;
              return <ChatMessage key={i} message={message} sender={sender} />;
            })}
          </div>
        );
      }

      function App() {
        const [chatMessages, setChatMessages] = React.useState([
          { message: "Hello chatot", sender: "user" },
          { message: "Hello! How can I help you?", sender: "robot" },
          { message: "today's date", sender: "user" },
          { message: "Today is June 13", sender: "robot" },
        ]);

        return (
          <div className="app-container">
            <ChatMessages chatMessages={chatMessages} />
            <ChatInput
              chatMessages={chatMessages}
              setChatMessages={setChatMessages}
            />
          </div>
        );
      }

      const container = document.querySelector("#js-container");
      ReactDOM.createRoot(container).render(<App />);
    </script>
  </body>
</html>
