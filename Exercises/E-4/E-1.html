<!doctype html>
<html>
  <head>
    <title>React Basics</title>
    <style>
      .buttonOn,
      .buttonOff {
        color: white;
        background-color: rgb(25, 135, 84);
        padding: 10px 15px;
        border-radius: 10px;
        border-width: 1px;
      }

      .buttonOff {
        background-color: red;
      }
    </style>
  </head>
  <body>
    <div class="js-container"></div>

    <script src="https://unpkg.com/supersimpledev/react.js"></script>
    <script src="https://unpkg.com/supersimpledev/react-dom.js"></script>

    <script src="https://unpkg.com/supersimpledev/babel.js"></script>
    <script src="https://unpkg.com/supersimpledev/dayjs.js"></script>
    <script type="text/babel">
      function App() {
        const [isButtonOn, setIsButtonOn] = React.useState(true);
        const [showPassword, setShowPassword] = React.useState(false);
        const [day, setDay] = React.useState(dayjs().format("HH:mm:ss"));

        React.useEffect(() => {
          const intervalId = setInterval(() => {
            setDay(dayjs().format("HH:mm:ss"));
          }, 1000);

          return () => {
            clearInterval(intervalId);
          };
        }, []);

        return (
          <>
            <button
              className={isButtonOn ? "buttonOn" : "buttonOff"}
              onClick={() => setIsButtonOn(!isButtonOn)}
            >
              {isButtonOn ? "ON" : "Off"}
            </button>
            <br />
            <br />
            <input type={showPassword ? "test" : "password"} />
            <button onClick={() => setShowPassword(!showPassword)}>
              {showPassword ? "Hide" : "Show"}
            </button>
            <p>Current Time: {day}</p>
          </>
        );
      }

      const container = document.querySelector(".js-container");
      const root = ReactDOM.createRoot(container);
      root.render(<App />);
    </script>
  </body>
</html>
